version = 1
id = "edo12n-piano-monome"
title = "EDO 12n Piano Monome"

[midi.input]
virtual_name = "edo12n_piano_monome-in"

[midi.output]
virtual_name = "edo12n_piano_monome-out"
min_channel = 1
min_note = 28

[piano.mapping]
kind = "twelve_n"
lowest_note = 21
shift_before_mapping = -5
edo_per_12 = 6

[[monomes]]
id = "little"
listen_port = 9000
prefix = "/128-1-cable"
select.size = [16, 8]
select.type_contains = "128"

[[monome_windows]]
id = "offset-board"
monome = "little"
kind = "twelve_edo_offset_board"
rect = [0, 0, 15, 7]
offset_columns = [0, 11]
offset_rows = [1, 7]
zero_row = 4
root_row = 0
group_columns = [13, 14, 15]
group_intervals = [[0, 2, 5, 7], [1, 3, 8, 10], [4, 6, 9, 11]]
