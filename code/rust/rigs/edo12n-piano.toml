version = 1
id = "edo12n-piano"
title = "EDO 12n Piano"

[midi.input]
virtual_name = "edo12n_piano-in"

[midi.output]
virtual_name = "edo12n_piano-out"
min_channel = 1
min_note = 28

[piano.mapping]
kind = "twelve_n"
lowest_note = 21
shift_before_mapping = -5
edo_per_12 = 6

[[piano.regions]]
range = [0, 96]
action = "emit_notes"

[[piano.regions]]
range = [97, 108]
action = "held_offset_control"
zero_note = 102

[display]
kind = "pitch_class_grid"
enabled = true
rows = 6
cols = 7
anchor_12edo_value = 4
row_step = 5
flash_millis = 500
tick_millis = 50
