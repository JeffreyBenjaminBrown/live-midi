version = 1
id = "2-monomes_58-8-1_kmss-drums-mock"
title = "Two monomes (58-8-1) + KMSS drums (mock grids)"

# ---------------------------------------------------------------------------
# Headless mock of the surfaces runtime: two mock 16x16 grids with the scroll
# pads, self-control waveform strips, and the accrete (sustain) button trios, driven with MIDI_PULSE_NO_AUDIO (no
# sound card). The KMSS drumkit is deliberately OMITTED here: entering tether
# mode shells out to `amidi` against a real device, which a headless test has
# no way to satisfy. This still exercises the two-grid discovery/bind, LED
# output, and press routing -- the device layer the pure tests can't. The runtime
# is still selected as "surfaces" (two edo grids on distinct monomes).
# ---------------------------------------------------------------------------

# Shared recent-note trail -- mirror the real config so mock play matches it.
[surfaces]
trail_clobber_radius = 27  # 1/27 of an octave (~44 cents); bigger = tighter
trails_max = 9

[[tunings]]
id = "main"
edo = 58
x_step = 8
y_step = 1
fundamental_hz = 80

[[sinks]]
id = "synth"
kind = "cpal_synth"
sample_rate = 48000
buffer_frames = 128
amplitude = 0.15
attack_secs = 0.003
release_secs = 0.050
accretion_level = 0.5

[[monomes]]
id = "a"
listen_port = 9102
prefix = "/mock-surface-a"
select.size = [16, 16]

[[monomes]]
id = "b"
listen_port = 9103
prefix = "/mock-surface-b"
select.size = [16, 16]

[[monome_windows]]
id = "grid-a"
monome = "a"
kind = "edo_note_grid"
rect = [0, 0, 15, 15]
tuning = "main"
sink = "synth"

[[monome_windows]]
id = "wave-a"
monome = "a"
kind = "waveform_selector"
rect = [0, 0, 3, 0]
controls = "a"

[[monome_windows]]
id = "vol-a"
monome = "a"
kind = "volume_strip"
rect = [4, 0, 15, 0]
controls = "a"

[[monome_windows]]
id = "scroll-a"
monome = "a"
kind = "edo_shift_pad"
rect = [13, 14, 15, 15]

# The sustain ("accrete") buttons, bottom row left (shared state -- either grid's
# trio acts globally; see TODO/misc.org "sustain (accrete)"):
#   (0,15) clear         -- silence + flush every sustained note (lit while pressed)
#   (1,15) needs_holding -- toggles whether accrete must be held (lit when on)
#   (2,15) accrete       -- hold (or, untoggled, tap) to sustain played/held notes;
#                           they ring until cleared
[[monome_windows]]
id = "acc-clear-a"
monome = "a"
kind = "accrete_control"
rect = [0, 15, 0, 15]
control = "clear"

[[monome_windows]]
id = "acc-hold-a"
monome = "a"
kind = "accrete_control"
rect = [1, 15, 1, 15]
control = "needs_holding"

[[monome_windows]]
id = "acc-accrete-a"
monome = "a"
kind = "accrete_control"
rect = [2, 15, 2, 15]
control = "accrete"

[[monome_windows]]
id = "grid-b"
monome = "b"
kind = "edo_note_grid"
rect = [0, 0, 15, 15]
tuning = "main"
sink = "synth"

[[monome_windows]]
id = "wave-b"
monome = "b"
kind = "waveform_selector"
rect = [0, 0, 3, 0]
controls = "b"

[[monome_windows]]
id = "vol-b"
monome = "b"
kind = "volume_strip"
rect = [4, 0, 15, 0]
controls = "b"

[[monome_windows]]
id = "scroll-b"
monome = "b"
kind = "edo_shift_pad"
rect = [13, 14, 15, 15]

# The sustain ("accrete") buttons, bottom row left (shared state -- either grid's
# trio acts globally; see TODO/misc.org "sustain (accrete)"):
#   (0,15) clear         -- silence + flush every sustained note (lit while pressed)
#   (1,15) needs_holding -- toggles whether accrete must be held (lit when on)
#   (2,15) accrete       -- hold (or, untoggled, tap) to sustain played/held notes;
#                           they ring until cleared
[[monome_windows]]
id = "acc-clear-b"
monome = "b"
kind = "accrete_control"
rect = [0, 15, 0, 15]
control = "clear"

[[monome_windows]]
id = "acc-hold-b"
monome = "b"
kind = "accrete_control"
rect = [1, 15, 1, 15]
control = "needs_holding"

[[monome_windows]]
id = "acc-accrete-b"
monome = "b"
kind = "accrete_control"
rect = [2, 15, 2, 15]
control = "accrete"
