version = 1
id = "2-monomes_58-8-1_kmss-drums-mock"
title = "Two monomes (58-8-1) + KMSS drums (mock grids)"

# ---------------------------------------------------------------------------
# Headless mock of the surfaces runtime: two mock 16x16 grids with the scroll
# pads, self-control waveform strips, and the accrete (sustain) button trios, driven with MIDI_PULSE_NO_AUDIO (no
# sound card). The KMSS drumkit is deliberately OMITTED here: entering tether
# mode shells out to `amidi` against a real device, which a headless test has
# no way to satisfy. This still exercises the two-grid discovery/bind, LED
# output, and press routing -- the device layer the pure tests can't. The runtime
# is still selected as "surfaces" (two edo grids on distinct monomes).
# ---------------------------------------------------------------------------

# Shared recent-note trail -- mirror the real config so mock play matches it.
[surfaces]
trail_clobber_radius = 27  # 1/27 of an octave (~44 cents); bigger = tighter
trails_max = 9
# Slide (the slide_toggle windows): a new note may glide from a note released
# within this many ms...
slide_candidate_window_ms = 1000
# ...taking this long to arrive at the new pitch.
slide_duration_ms = 100
# Tap tempo (the tap_tempo_pad): two taps at most this far apart set the tempo.
tap_tempo_window_ms = 2000

[[tunings]]
id = "main"
edo = 58
x_step = 8
y_step = 1
fundamental_hz = 80

# ---------------------------------------------------------------------------
# The four selectable timbres behind each grid's waveform strip, left to right.
# Each has a base waveform ("sin"/"sine", "tri"/"triangle", "square", "saw") and
# numeric parameters; everything but amplitude ships "off". Ranges:
#   amplitude      per-timbre gain, multiplied below the volume fader; 0..1
#                  typical (above 1 amplifies -- watch the clamp). Default 1.0.
#   am_depth       tremolo depth 0..1 (0 = off; 1 dips to silence)
#   am_freq        tremolo rate in Hz; ~0.1..10 musical (default 1.0)
#   am_shape       tremolo LFO morph 0..1 (0 smooth .. 1 near-square chop)
#   fm_depth_cents vibrato depth in cents; ~5..50 subtle, 100+ seasick (0 = off)
#   fm_freq        vibrato rate in Hz; ~0.1..10 musical (default 1.0)
# ---------------------------------------------------------------------------

[[timbres]]
waveform = "sin"

[[timbres]]
waveform = "tri"

[[timbres]]
waveform = "square"

[[timbres]]
waveform = "saw"

[[sinks]]
id = "synth"
kind = "cpal_synth"
sample_rate = 48000
buffer_frames = 128
amplitude = 0.15
attack_secs = 0.003
release_secs = 0.050
accretion_level = 0.5
# Pluck envelope: a fresh strike peaks, then decays exponentially toward
# sustain_level x peak (time constant decay_secs), so new notes ring out over held
# ones -- a rough plucked-string curve that plateaus instead of dying (held notes
# and accrete drones keep ringing at the sustain).
# sustain_level: fraction of the strike peak; 0.2..0.5 natural, >= 1.0 disables.
sustain_level = 0.35
# decay_secs: the decay time constant; ~0.3 snappy, ~1.5 slow ring, <= 0 disables.
decay_secs = 0.5
# Distortion (per-monome; heard only while a grid's distortion_toggle is on): the
# soft-clipper f(y) = y / (1 + |y/s|^k)^(1/k) on the switched-on grids' summed mix.
# scale s: the asymptote; ~0.3 heavy, ~1.0 strong, 2-3 gentle, >=5 nearly clean.
distortion_scale = 1.0
# shape k: elbow harshness; 1 gentlest, 2 smooth sweet spot, 4-8 hard-ish edge.
distortion_shape = 2.0

[[monomes]]
id = "a"
listen_port = 9102
prefix = "/mock-surface-a"
select.size = [16, 16]

[[monomes]]
id = "b"
listen_port = 9103
prefix = "/mock-surface-b"
select.size = [16, 16]

[[monome_windows]]
id = "grid-a"
monome = "a"
kind = "edo_note_grid"
rect = [0, 0, 15, 15]
tuning = "main"
sink = "synth"

[[monome_windows]]
id = "wave-a"
monome = "a"
kind = "waveform_selector"
rect = [0, 0, 3, 0]
controls = "a"


[[monome_windows]]
id = "scroll-a"
monome = "a"
kind = "edo_shift_pad"
rect = [13, 14, 15, 15]

# The sustain ("accrete") buttons, bottom row left. One accrete BANK per monome:
# this trio drives only this grid's bank, and only notes fingered on this grid can
# join it (see TODO/misc.org "sustain (accrete)"):
#   (0,15) clear         -- silence + flush this grid's sustained notes (lit while pressed)
#   (1,15) needs_holding -- toggles whether accrete must be held (lit when on)
#   (2,15) accrete       -- hold (or, untoggled, tap) to sustain played/held notes;
#                           they ring until cleared
#   (1,14) erase         -- accrete's mirror image (same needs_holding rule): pressed
#                           pitches LEAVE the sustained set, each sounding until its
#                           own finger lifts; when both are live, erase wins
[[monome_windows]]
id = "acc-clear-a"
monome = "a"
kind = "accrete_control"
rect = [0, 15, 0, 15]
control = "clear"

[[monome_windows]]
id = "acc-hold-a"
monome = "a"
kind = "accrete_control"
rect = [1, 15, 1, 15]
control = "needs_holding"

[[monome_windows]]
id = "acc-accrete-a"
monome = "a"
kind = "accrete_control"
rect = [2, 15, 2, 15]
control = "accrete"

[[monome_windows]]
id = "acc-erase-a"
monome = "a"
kind = "accrete_control"
rect = [1, 14, 1, 14]
control = "erase"

# The distortion toggle (key-down flips; see learnings/distortion.org for the
# curve). PER-GRID: this grid's button routes this grid's voices through the
# distorted bus; a grid left off bypasses the clipper.
[[monome_windows]]
id = "dist-a"
monome = "a"
kind = "distortion_toggle"
rect = [0, 1, 0, 1]

# Slide toggle (key-down flips; PER-GRID): a new note on this grid re-triggers the
# nearest recently-released pitch and glides it into the new one. Knobs: [surfaces].
[[monome_windows]]
id = "slide-a"
monome = "a"
kind = "slide_toggle"
rect = [1, 1, 1, 1]

# Mono toggle (key-down flips; PER-GRID): each new note cuts this grid's other
# fingered notes (with slide on, the new note steals the cut voice -- legato).
[[monome_windows]]
id = "mono-a"
monome = "a"
kind = "mono_toggle"
rect = [1, 2, 1, 2]

# Feet accrete (key-down flips; PER-GRID): while on, the KMSS pedal triple mapped
# to this grid -- 1/2/3 for the older (monobright) monome, 8/9/0 for the other --
# mirrors this grid's accrete trio (clear / needs-holding / accrete) instead of
# playing samples. The softstep can mirror one monome, both, or neither. Just
# above the on-grid trio.
[[monome_windows]]
id = "feet-accrete-a"
monome = "a"
kind = "softstep_accretes_toggle"
rect = [0, 14, 0, 14]

# The polyrhythm pad, top-right: | x3 x2 tap | /3 /2 =1 |. Tap twice within
# [surfaces].tap_tempo_window_ms to set the tempo (the tap cell blinks at 10%
# duty); the factor buttons scale it exactly (2^a * 3^b, =1 resets). Notes struck
# while a tempo is applied pulse with a descending sawtooth at that tempo (fixed
# per note, separate from any [[timbres]] AM).
[[monome_windows]]
id = "poly-a"
monome = "a"
kind = "tap_tempo_pad"
rect = [13, 0, 15, 1]

[[monome_windows]]
id = "grid-b"
monome = "b"
kind = "edo_note_grid"
rect = [0, 0, 15, 15]
tuning = "main"
sink = "synth"

[[monome_windows]]
id = "wave-b"
monome = "b"
kind = "waveform_selector"
rect = [0, 0, 3, 0]
controls = "b"


[[monome_windows]]
id = "scroll-b"
monome = "b"
kind = "edo_shift_pad"
rect = [13, 14, 15, 15]

