# See also softstep.toml (the shared SoftStep detection & velocity parameters).
version = 1
id = "2-monomes_58-8-1_kmss-drums"
title = "Two monomes (58-8-1) + KMSS drums"

# ===========================================================================
# THREE SURFACES AT ONCE (see configs/2-monomes_58-8-1_kmss-drums.org):
#   - two 16x16 monome grids, each a full 58-EDO play surface with its own
#     independent scroll register and its own voices;
#   - the KMSS pedalboard as a velocity-sensitive TR-808 drumkit.
#
# Each grid also carries a 4-cell waveform strip on its top row that sets its
# OWN timbre, a volume fader that sets its OWN loudness, and a 3x2 scroll pad
# in the bottom-right that moves *that* grid's pitch window. The same pitch
# fingered on both grids is two independent voices (releasing one never cuts
# the other), each in its grid's currently-selected waveform.
#
# Launch under pw-jack so the synth + drum sampler share the card via PipeWire:
#   pw-jack cargo run --bin midi_pulse -- 2-monomes_58-8-1_kmss-drums
# ===========================================================================

# Shared recent-note trail (the dim backdrop of the last few played pitch classes).
[surfaces]
# Clobber radius as a divisor of the octave: a played note clears any trailed class
# within edo/trail_clobber_radius steps of it. 27 -> 1/27 of an octave (~44 cents);
# bigger = tighter = fewer potential neighbors to clobber.
trail_clobber_radius = 27
# How many distinct pitch classes the trail keeps at once (newest first).
trails_max = 9

[[tunings]]
id = "main"
edo = 46
x_step = 9
y_step = 1
fundamental_hz = 80

# The play-grid synth (both grids' voices go here; each voice carries its grid's
# waveform). Waveform-only timbre -- gain/AM/FM stay at their inert defaults.
[[sinks]]
id = "synth"
kind = "cpal_synth"
sample_rate = 48000
buffer_frames = 128
# The single master synth volume for BOTH grids (linear; 1.0 = full scale). Pull the
# synth down here if it clips. The on-grid volume faders are live per-grid trims that
# multiply *below* this.
amplitude = 0.15
attack_secs = 0.003
release_secs = 0.050
accretion_level = 0.5

# The drum sampler (one-shot WAVs). Same cpal/JACK path as the synth.
[[sinks]]
id = "drums"
kind = "cpal_sampler"
sample_rate = 48000
buffer_frames = 128
# The single drum-kit volume knob (linear; per-pad `gain` trims individual pads below it).
# 1.6 = the old sink 0.8 x drum_sample_amplitude 2.0, now folded into one knob.
amplitude = 1.6

[[monomes]]
id = "a"
listen_port = 9000
prefix = "/surface-a"
select.size = [16, 16]

[[monomes]]
id = "b"
listen_port = 9001
prefix = "/surface-b"
select.size = [16, 16]

# ---------------------------------------------------------------------------
# GRID A -- 58-EDO play surface. Its top-row strips set its OWN timbre + volume.
# ---------------------------------------------------------------------------

[[monome_windows]]
id = "grid-a"
monome = "a"
kind = "edo_note_grid"
rect = [0, 0, 15, 15]
tuning = "main"
sink = "synth"

# 4-cell waveform strip (sine / triangle / square / saw), top-left, sets GRID A.
[[monome_windows]]
id = "wave-a"
monome = "a"
kind = "waveform_selector"
rect = [0, 0, 3, 0]
controls = "a"

# 12-cell volume strip filling the rest of the top row, sets GRID A's loudness. Live
# (a fader, not a radio), logarithmic over 30 dB, top cell = unity; the active cell is
# lit and the rest dark. Starts at column 10 (5 cells of headroom to its right).
[[monome_windows]]
id = "vol-a"
monome = "a"
kind = "volume_strip"
rect = [4, 0, 15, 0]
controls = "a"

# 3x2 scroll pad, bottom-right: arrows shift grid A's pitch window by one cell,
# the two top corners by an octave.
[[monome_windows]]
id = "scroll-a"
monome = "a"
kind = "edo_shift_pad"
rect = [13, 14, 15, 15]

# The sustain ("accrete") buttons, bottom row left (shared state -- either grid's
# trio acts globally; see TODO/misc.org "sustain (accrete)"):
#   (0,15) clear         -- silence + flush every sustained note (lit while pressed)
#   (1,15) needs_holding -- toggles whether accrete must be held (lit when on)
#   (2,15) accrete       -- hold (or, untoggled, tap) to sustain played/held notes;
#                           they ring until cleared
[[monome_windows]]
id = "acc-clear-a"
monome = "a"
kind = "accrete_control"
rect = [0, 15, 0, 15]
control = "clear"

[[monome_windows]]
id = "acc-hold-a"
monome = "a"
kind = "accrete_control"
rect = [1, 15, 1, 15]
control = "needs_holding"

[[monome_windows]]
id = "acc-accrete-a"
monome = "a"
kind = "accrete_control"
rect = [2, 15, 2, 15]
control = "accrete"

# ---------------------------------------------------------------------------
# GRID B -- 58-EDO play surface. Its top-row strips set its OWN timbre + volume.
# ---------------------------------------------------------------------------

[[monome_windows]]
id = "grid-b"
monome = "b"
kind = "edo_note_grid"
rect = [0, 0, 15, 15]
tuning = "main"
sink = "synth"

[[monome_windows]]
id = "wave-b"
monome = "b"
kind = "waveform_selector"
rect = [0, 0, 3, 0]
controls = "b"

[[monome_windows]]
id = "vol-b"
monome = "b"
kind = "volume_strip"
rect = [4, 0, 15, 0]
controls = "b"

[[monome_windows]]
id = "scroll-b"
monome = "b"
kind = "edo_shift_pad"
rect = [13, 14, 15, 15]

# The sustain ("accrete") buttons, bottom row left (shared state -- either grid's
# trio acts globally; see TODO/misc.org "sustain (accrete)"):
#   (0,15) clear         -- silence + flush every sustained note (lit while pressed)
#   (1,15) needs_holding -- toggles whether accrete must be held (lit when on)
#   (2,15) accrete       -- hold (or, untoggled, tap) to sustain played/held notes;
#                           they ring until cleared
[[monome_windows]]
id = "acc-clear-b"
monome = "b"
kind = "accrete_control"
rect = [0, 15, 0, 15]
control = "clear"

[[monome_windows]]
id = "acc-hold-b"
monome = "b"
kind = "accrete_control"
rect = [1, 15, 1, 15]
control = "needs_holding"

[[monome_windows]]
id = "acc-accrete-b"
monome = "b"
kind = "accrete_control"
rect = [2, 15, 2, 15]
control = "accrete"

# ---------------------------------------------------------------------------
# KMSS drumkit (velocity-sensitive TR-808), reusing the kmss-drumkit layout.
# ---------------------------------------------------------------------------

[[softsteps]]
id = "feet"
select.name_contains = "SSCOM"

[[softstep_windows]]
id = "kit"
softstep = "feet"
kind = "drumkit"
sink = "drums"
# Detection/velocity knobs (debounce, de-stick, thresholds) are shared -- see softstep.toml.
pads = [
  { pedal = 1, sample = "kick.wav" },
  { pedal = 2, sample = "snare.wav" },
  { pedal = 6, sample = "low_tom.wav" },
  { pedal = 7, sample = "high_tom.wav" },
  { pedal = 8, sample = "crash_electronic.wav", gain = 0.5 },  # real crash (synth, CC0), not the 808 CY; fuller than the kit -> trimmed a bit
  { pedal = 4, sample = "hat.wav" },
  { pedal = 5, sample = "ride.wav" },
  { pedal = 9, sample = "cowbell.wav" },
  { pedal = 0, sample = "wood_block.wav" },
]
