version = 1
id = "monome-looper-58-8-1-timbre"
title = "Monome Looper 58 8 1 (timbre)"

# ---------------------------------------------------------------------------
# The full timbre instrument (6_plan + 7_layout.org). Two timbre editors:
#  - EDO monome: the loop-timbre editor (target=loop), occluding the top of the
#    play grid. Select notes on the loop display, then dial params here to stamp
#    them; with no selection + a playing loop, hold a param to play-along.
#  - LOOPS monome: the live-timbre editor (target=live), with the whole looper
#    stack (slots, transport, copy/undo/remap, loop display) reflowing DOWN under
#    it. Both editors rest FOLDED (a 1-row strip); unfolding the loops editor
#    slides the looper stack down by 6 rows (7_layout.org). Edit X's timbre on the
#    not-X monome so X stays visible (6_plan 2.2).
# Loops rects below are the UNFOLDED positions; the runtime starts folded.
# ---------------------------------------------------------------------------

[[tunings]]
id = "main"
edo = 58
x_step = 8
y_step = 1
fundamental_hz = 80

[[sinks]]
id = "saw"
kind = "cpal_synth"
sample_rate = 48000
buffer_frames = 128
amplitude = 0.15
attack_secs = 0.003
release_secs = 0.050
accretion_level = 0.5

# Instrument-wide AM shape morph family (6_plan 2.5). The editor's shape row sweeps
# the per-note morph position within this family.
[am.shape]
family = "sin_to_square"

[looper]
quantize_record_ms = 70
cluster_display_ms = 100
flash_ms = 50
remap_center = [7, 7]

[[monomes]]
id = "edo"
listen_port = 9000
prefix = "/looper-edo"
select.size = [16, 16]

[[monomes]]
id = "loops"
listen_port = 9001
prefix = "/looper-loops"
select.size = [16, 16]

# ===========================================================================
# GRID 1 -- "edo": play surface (lower rows), timbre editor (top 7 rows).
# ===========================================================================

[[monome_windows]]
id = "edo-grid"
monome = "edo"
kind = "edo_note_grid"
rect = [0, 0, 15, 15]
tuning = "main"
sink = "saw"

# The timbre editor, listed AFTER edo-grid so it occludes the top 7 rows. Row 0 is
# the control row (fold | Sine Triangle Square Saw | arm | sustain | save-undo |
# slots..), then amplitude, then AM amp/freq/shape and FM amp/freq. Row ranges are
# the 6_plan 5 defaults, spelled out here to exercise the explicit-range path.
[[monome_windows]]
id = "edo-timbre"
monome = "edo"
kind = "timbre_editor"
target = "loop"
rect = [0, 0, 15, 6]
amplitude    = { kind = "log_range",  least = 0.0009, greatest = 0.15 }
am_amplitude = { kind = "linear",     min = 0.0, max = 1.0 }
am_frequency = { kind = "log_factor", least = 0.25, multiplier = 2.0 }
am_shape     = { kind = "linear",     min = 0.0, max = 1.0 }
fm_amplitude = { kind = "log_factor", least = 5.0,  multiplier = 2.0 }
fm_frequency = { kind = "log_factor", least = 0.25, multiplier = 2.0 }

[[monome_windows]]
id = "edo-shift-pad"
monome = "edo"
kind = "edo_shift_pad"
rect = [13, 14, 15, 15]

# ===========================================================================
# GRID 2 -- "loops": the live-timbre editor on top, then the looper stack
# (slots, transport, copy/undo/remap, loop display) reflowing under it. Rects are
# the UNFOLDED positions (editor = rows 0..6, stack rows 7..15); folded, the stack
# slides up by 6 (strip row 0, slots 1..2, display 3..15). See 7_layout.org.
# ===========================================================================

# The live-timbre editor: edits the live timbre (what fingered edo notes use).
[[monome_windows]]
id = "live-timbre"
monome = "loops"
kind = "timbre_editor"
target = "live"
rect = [0, 0, 15, 6]
amplitude    = { kind = "log_range",  least = 0.0009, greatest = 0.15 }
am_amplitude = { kind = "linear",     min = 0.0, max = 1.0 }
am_frequency = { kind = "log_factor", least = 0.25, multiplier = 2.0 }
am_shape     = { kind = "linear",     min = 0.0, max = 1.0 }
fm_amplitude = { kind = "log_factor", least = 5.0,  multiplier = 2.0 }
fm_frequency = { kind = "log_factor", least = 0.25, multiplier = 2.0 }

# Two rows of loop slots (rows 7-8); transport + copy/undo/remap overlay them.
[[monome_windows]]
id = "loop-slots"
monome = "loops"
kind = "loop_slots"
rect = [0, 7, 15, 8]

[[monome_windows]]
id = "loop-copy"
monome = "loops"
kind = "loop_copy_button"
rect = [15, 7, 15, 7]

[[monome_windows]]
id = "loop-start"
monome = "loops"
kind = "loop_control"
control = "start"
rect = [0, 8, 0, 8]

[[monome_windows]]
id = "loop-stop"
monome = "loops"
kind = "loop_control"
control = "stop"
rect = [1, 8, 1, 8]

[[monome_windows]]
id = "loop-play"
monome = "loops"
kind = "loop_control"
control = "play"
rect = [2, 8, 2, 8]

[[monome_windows]]
id = "loop-remap-mode"
monome = "loops"
kind = "loop_remap_mode_toggle"
rect = [14, 8, 14, 8]

[[monome_windows]]
id = "loop-remap-undo"
monome = "loops"
kind = "loop_remap_undo"
rect = [15, 8, 15, 8]

[[monome_windows]]
id = "loop-display"
monome = "loops"
kind = "loop_display"
rect = [0, 9, 15, 15]
