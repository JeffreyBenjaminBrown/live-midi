version = 1
id = "monome-looper-58-8-1"
title = "Monome Looper 58 8 1"

# ---------------------------------------------------------------------------
# Two 16x16 grids, no piano. One is the EDO play/remap surface ("edo"), the
# other is the LOOPS surface ("loops"). Both match select.size = [16,16]; the
# runtime hands each config monome a DISTINCT unclaimed grid in config order
# (so the first-discovered grid is "edo", the second "loops"). We don't care
# which physical grid is which. See 6_plan.org.
# ---------------------------------------------------------------------------

[[tunings]]
id = "main"
edo = 58
x_step = 8
y_step = 1
fundamental_hz = 80

# cpal sawwave sink, same params as monome-edo-sawwave. BOTH live play and loop
# playback emit note events into this synth.
[[sinks]]
id = "saw"
kind = "cpal_sawwave"
sample_rate = 48000
buffer_frames = 128
amplitude = 0.15
attack_secs = 0.003
release_secs = 0.050
accretion_level = 0.5

# Looper-wide scalars (all ms unless noted).
[looper]
quantize_record_ms = 70   # events within this of the loop boundary snap to it
cluster_display_ms = 100  # notes within this of each other = one display column
flash_ms = 50             # reflection / equivalent flash half-period (50 on / 50 off)
remap_center = [7, 7]     # edo-grid cell meaning "unison" in group-transpose remap

[[monomes]]
id = "edo"
listen_port = 9000
prefix = "/looper-edo"
select.size = [16, 16]

[[monomes]]
id = "loops"
listen_port = 9001
prefix = "/looper-loops"
select.size = [16, 16]

# ===========================================================================
# GRID 1 -- "edo": play surface, loop reflection, remap pitch-picker.
# ===========================================================================

[[monome_windows]]
id = "edo-grid"
monome = "edo"
kind = "edo_note_grid"
rect = [0, 0, 15, 15]
tuning = "main"
sink = "saw"

# 3x2 shift pad overlaid on the lower-right (listed AFTER edo-grid so it sits on
# top). Arrows shift the pitch image by one CELL; the two top corners by an octave.
#        x=13         x=14        x=15
#  y=14  octave-down  shift-up    octave-up
#  y=15  shift-left   shift-down  shift-right
[[monome_windows]]
id = "edo-shift-pad"
monome = "edo"
kind = "edo_shift_pad"
rect = [13, 14, 15, 15]

# ===========================================================================
# GRID 2 -- "loops": slots, transport, loop display, remap controls.
# ===========================================================================

# 4x4 slot grid (16 slots). One is ACTIVE. The transport windows below overlay
# its bottom row, so those three slots are unreachable ("no harm").
[[monome_windows]]
id = "loop-slots"
monome = "loops"
kind = "loop_slots"
rect = [0, 0, 3, 3]

[[monome_windows]]
id = "loop-start"      # begin recording into the active slot (overwrites it)
monome = "loops"
kind = "loop_control"
control = "start"
rect = [0, 3, 0, 3]

[[monome_windows]]
id = "loop-stop"       # stop the active slot's current activity -- record OR play
monome = "loops"
kind = "loop_control"
control = "stop"
rect = [1, 3, 1, 3]

[[monome_windows]]
id = "loop-play"       # stop recording (if any) and loop the active slot
monome = "loops"
kind = "loop_control"
control = "play"
rect = [2, 3, 2, 3]

# Remap-mode toggle: fine vs group transpose. Both are destructive; toggling back
# to fine also ENDS a group-transpose session. Lit solid in fine (the default),
# dim in group transpose.
[[monome_windows]]
id = "loop-remap-mode"
monome = "loops"
kind = "loop_remap_mode_toggle"
rect = [14, 3, 14, 3]

# Copy a slot to another: press this, then 'from' slot, then 'to' slot. Lit solid
# while armed; pressing it again mid-gesture cancels (forgetting any picked slot).
[[monome_windows]]
id = "loop-copy"
monome = "loops"
kind = "loop_copy_button"
rect = [15, 2, 15, 2]

# One-press undo of the last loop remap (fine or group transpose). Its own looper kind --
# shares the undo mechanism in code, not the entangled remap_undo_button kind.
[[monome_windows]]
id = "loop-remap-undo"
monome = "loops"
kind = "loop_remap_undo"
rect = [15, 3, 15, 3]

# The loop display compound: one rect derives a left row-picker column, a top
# column-picker row, a reserved corner (0,5), and the main time x pitch area.
[[monome_windows]]
id = "loop-display"
monome = "loops"
kind = "loop_display"
rect = [0, 4, 15, 15]
