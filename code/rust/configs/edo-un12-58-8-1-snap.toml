version = 1
id = "edo-un12-58-8-1-snap"
title = "EDO un-12 58 8 1 Snap"

[[tunings]]
id = "main"
edo = 58
x_step = 8
y_step = 1
fundamental_hz = 80

[midi.input]
virtual_name = "edo_un12_piano_monome-in"

[midi.output]
virtual_name = "edo_un12_piano_monome-out"
min_channel = 1
min_note = 28

[piano.mapping]
kind = "remappable_un12"
lowest_note = 24
tuning = "main"
remap_idiom = "snap"
initial_map = "even"

[[monomes]]
id = "big"
listen_port = 9000
prefix = "/256-1-cable"
select.size = [16, 16]
select.type_contains = "256"

[[monome_windows]]
id = "preimage-row"
monome = "big"
kind = "preimage_row"
rect = [0, 0, 11, 0]

[[monome_windows]]
id = "remap-grid"
monome = "big"
kind = "remappable_un12_grid"
rect = [0, 1, 9, 15]
tuning = "main"

[[monome_windows]]
id = "undo"
monome = "big"
kind = "remap_undo_button"
rect = [15, 15, 15, 15]
