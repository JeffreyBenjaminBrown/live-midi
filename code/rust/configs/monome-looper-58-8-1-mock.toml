version = 1
id = "monome-looper-58-8-1-mock"
title = "Monome Looper 58 8 1 (mock grids)"

# ---------------------------------------------------------------------------
# Identical to monome-looper-58-8-1.toml EXCEPT the two monomes use non-colliding
# listen ports (9100/9101 instead of 9000/9001) and distinct prefixes. That lets
# this looper run AT THE SAME TIME as a real session against the `mock_monome`
# virtual rig:
#
#   cargo run --bin mock_monome -- --detector-port 17002
#   MIDI_PULSE_DETECTOR_PORT=17002 cargo run --bin midi_pulse -- monome-looper-58-8-1-mock
#
# The mock reports two 16x16 "monome 256" grids, so select.size = [16,16] still
# assigns them in config order (first -> edo, second -> loops). See MOCK-MONOME.org.
# ---------------------------------------------------------------------------

[[tunings]]
id = "main"
edo = 58
x_step = 8
y_step = 1
fundamental_hz = 80

[[sinks]]
id = "saw"
kind = "cpal_sawwave"
sample_rate = 48000
buffer_frames = 128
amplitude = 0.15
attack_secs = 0.003
release_secs = 0.050
accretion_level = 0.5

[looper]
quantize_record_ms = 70
cluster_display_ms = 100
flash_ms = 50
remap_center = [7, 7]

[[monomes]]
id = "edo"
listen_port = 9100         # mock: 9100 instead of 9000
prefix = "/mock-edo"
select.size = [16, 16]

[[monomes]]
id = "loops"
listen_port = 9101         # mock: 9101 instead of 9001
prefix = "/mock-loops"
select.size = [16, 16]

# ===========================================================================
# GRID 1 -- "edo": play surface, loop reflection, remap pitch-picker.
# ===========================================================================

[[monome_windows]]
id = "edo-grid"
monome = "edo"
kind = "edo_note_grid"
rect = [0, 0, 15, 15]
tuning = "main"
sink = "saw"

[[monome_windows]]
id = "edo-shift-pad"
monome = "edo"
kind = "edo_shift_pad"
rect = [13, 14, 15, 15]

# ===========================================================================
# GRID 2 -- "loops": slots, transport, loop display, remap controls.
# ===========================================================================

[[monome_windows]]
id = "loop-slots"
monome = "loops"
kind = "loop_slots"
rect = [0, 0, 3, 3]

[[monome_windows]]
id = "loop-start"
monome = "loops"
kind = "loop_control"
control = "start"
rect = [0, 3, 0, 3]

[[monome_windows]]
id = "loop-stop"
monome = "loops"
kind = "loop_control"
control = "stop"
rect = [1, 3, 1, 3]

[[monome_windows]]
id = "loop-play"
monome = "loops"
kind = "loop_control"
control = "play"
rect = [2, 3, 2, 3]

[[monome_windows]]
id = "loop-remap-mode"
monome = "loops"
kind = "loop_remap_mode_toggle"
rect = [14, 3, 14, 3]

[[monome_windows]]
id = "loop-copy"
monome = "loops"
kind = "loop_copy_button"
rect = [15, 2, 15, 2]

[[monome_windows]]
id = "loop-remap-undo"
monome = "loops"
kind = "loop_remap_undo"
rect = [15, 3, 15, 3]

[[monome_windows]]
id = "loop-display"
monome = "loops"
kind = "loop_display"
rect = [0, 4, 15, 15]
