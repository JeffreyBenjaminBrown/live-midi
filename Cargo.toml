[package]
name = "midi_pulse"
version = "0.1.0"
edition = "2021"

[lib]
path = "code/rust/midi_pulse/lib.rs"

[[bin]]
name = "polite_ping"
path = "code/rust/demos-and-explorations/polite_ping.rs"

[[bin]]
name = "add_echo"
path = "code/rust/demos-and-explorations/add_echo.rs"

[[bin]]
name = "sampler"
path = "code/rust/sampler/sampler.rs"

[[bin]]
name = "midi_pulse"
path = "code/rust/midi_pulse/midi_pulse.rs"

[[bin]]
name = "mock_monome"
path = "code/rust/midi_pulse/mock_monome_bin.rs"

[[bin]]
name = "softstep_meter"
path = "code/rust/midi_pulse/softstep_meter.rs"

[[bin]]
name = "pedal_monitor"
path = "code/rust/midi_pulse/pedal_monitor.rs"

[[bin]]
name = "triangle_chord"
path = "code/rust/synth/triangle_chord.rs"

[dependencies]
midir = "0.10"
minifb = "0.27"
# Pure-Rust TTF rasterizer with anti-aliasing, for the on-screen readouts. No
# system font/C deps: it takes the bytes we embed and hands back a coverage mask.
fontdue = "0.9"
rosc = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
cpal = { version = "0.15", features = ["jack"] }
hound = "3"
