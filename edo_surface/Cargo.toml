[package]
name = "edo_surface"
version = "0.1.0"
edition = "2021"

# The live instrument core (cleaning phase 7): everything the latest rig
# (2-edogrids_ss-accrete_ss-pulse) runs -- the surfaces + drumkit runtimes, the sawwave engine,
# the rig loader/org parser, monome + mock, expression pedals, device assignment, the
# bitmap font. Deliberately does NOT depend on midi_pulse (`buried/`): the dependency
# arrow points the other way -- buried refers to live, never the reverse. Its rigs live
# in ../rigs/, its mock rigs in mocks/, drum samples in ../drum-samples/ (see rig.rs's
# rig_dir/mock_rig_dir/drum_samples_dir).

[dependencies]
midir = "0.10"
minifb = "0.27"
# Pure-Rust TTF rasterizer with anti-aliasing, for the on-screen readouts. No
# system font/C deps: it takes the bytes we embed and hands back a coverage mask.
fontdue = "0.9"
rosc = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
cpal = { version = "0.15", features = ["jack"] }
hound = "3"
