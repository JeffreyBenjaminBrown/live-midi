# SoftStep hit-detection & pressure parameters -- shared across every rig.
#
# There is no reason for these to vary from one rig to the next, so they live here once
# rather than being duplicated in each rig's [[softstep_windows]]. Every rig that uses
# the SoftStep carries a "see also softstep.toml" note at the top. The Python meter
# (tools/softstep/meter/config.toml) mirrors these same numbers.
#
# All keys are optional; a missing key uses the default shown. Reject-on-typo is on.

on_sum              = 25    # a hit fires when a pad's sum-of-4 exceeds this
off_sum             = 10    # the pad re-arms once its sum-of-4 falls below this
#
# on_sum > off_sum is a Schmitt trigger: a pad must fall back to 20 before it can fire
# again at 40, so a sum hovering at the threshold cannot chatter. These were EQUAL (20/20)
# until 2026-07-20, i.e. there was no hysteresis band at all. For scale, KMI's own editor
# ships 50/45 -- but on max-of-4 (0..127), not our sum-of-4 (0..508), so their band is
# both higher and much narrower than it looks. See learnings/keith-mcmillen-softstep.org.
attack_ms           = 14    # after firing on onset, keep watching this long to raise pressure to a later peak
pressure_full_scale = 460   # pad sum-of-4 (0..508) that maps to full pressure (1.0)
gain_db_range       = 20.0  # dB between the softest (pressure 0) and hardest (pressure 1) hit
silence_to_zero_ms  = 25    # a sensor with no CC for this long reads 0 (de-stick); 0 = off
factor_settle_ms    = 150   # Settle pads (x2, /2, ...): minimum time from a fire until it may fire again
factor_release_ms   = 25    # Settle pads: how long the pad must sit below off_sum before it may re-arm

# Standard pads (drums, accrete -- every pad that is not a tempo-factor pedal). The same
# two-guard shape as the factor_* pair above: a clock guard and a signal guard.
standard_settle_ms  = 120   # minimum time from a fire until this pad may fire again
standard_release_ms = 45    # ...and its sum must ALSO have held UNCHANGED this long first
#
# Both are per-pad; nothing in the decoder couples pads, so two feet always both fire.
# The clock guard caps one pad at ~8 strikes/second -- if fast rolls on a single pad get
# eaten, that is this knob. The signal guard is the one a bounce cannot outlast: the
# tether stream is on-change, so an unchanged sum means the pad is sending nothing.
# Setting both to 0 restores the pre-2026-07-20 behaviour (quiet gate only, at 25 ms).

# Sum-of-4 at or above which a strike counts as HARD rather than light, so one pad can
# serve two related purposes (tap lightly for one, stomp for the other). A raw sum, like
# on_sum -- not a pressure or a velocity -- so you can read it straight off the meter's
# `sum` column.
#
# 200 is a starting guess, NOT a measurement: the only figure ever recorded is "hard hits
# measure ~430-460 against the 508 ceiling", and there is no light-press figure at all, so
# there is no observed range to take the midpoint of. Capture one with
# `python3 tools/softstep/meter/main.py` (step on each pad light, then hard) and set
# this from the data.
#
# Reads the ATTACK PEAK -- i.e. how fast you stomp, not how hard you end up standing. Right
# for a tap; meaningless for a pedal you HOLD, like accrete.
pressure_threshold_sum = 200

# The un-12 piano runtime's SUSTAIN pedal (pad printed "0", the rightmost top pad):
# any pad-0 sensor CC whose sum-of-4 is at least sustain_on_sum counts as "foot on the
# pedal" and refreshes a window; sustain (CC 64 to the 58-edo 1 Reaper input) is on
# while the window is fresh and off once it has been sustain_window_ms without a
# qualifying signal. There is deliberately no off threshold: the tether stream is
# on-change, so a lifted foot goes silent and the window lapsing IS the release --
# that lapse is also the debounce. Independent of on_sum/off_sum above, which are
# strike detection for drums; this is a held level. Only the remap (un-12) runtime
# reads these.
sustain_on_sum    = 40    # sum-of-4 at/above which a pad-0 CC counts as pedal pressure
sustain_window_ms = 150   # sustain holds this long past the last qualifying signal
